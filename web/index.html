<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moto Devil</title>
    <!-- No favicon request; the page loads nothing but itself and the game. -->
    <link rel="icon" href="data:,">
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111316;
        color: #e8e2d4;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
      }
      /* The playing field: 16:9, as large as the window allows. */
      #field {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
      }
      #moto-devil {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
        font-size: 1.4rem;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="field">
      <canvas id="moto-devil" tabindex="0"></canvas>
      <p id="status">Lädt …</p>
    </div>
    <script type="module">
      const status = document.getElementById("status");
      const canvas = document.getElementById("moto-devil");

      if (!document.createElement("canvas").getContext("webgl2")) {
        status.textContent =
          "Dieser Browser kann kein WebGL2. Moto Devil läuft in einem aktuellen Firefox, Chrome oder Safari.";
      } else {
        try {
          const { default: init } = await import("./moto-devil.js");
          await init();
          status.hidden = true;
          // The keyboard goes to the game; a click on the field brings it back.
          canvas.focus();
        } catch (error) {
          console.error(error);
          status.textContent = "Moto Devil konnte nicht starten.";
        }
      }
    </script>
  </body>
</html>
