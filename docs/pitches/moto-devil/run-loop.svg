<text x="806" y="573.4" font-size="17" fill="#1e1e1e" text-anchor="start">oder Stacheln / Säule / TNT</text>
<text x="806" y="594.65" font-size="17" fill="#1e1e1e" text-anchor="start">oder aus dem Level gefallen</text>
<text x="806" y="615.9" font-size="17" fill="#1e1e1e" text-anchor="start">weiter als je zuvor?</text>
<text x="806" y="637.15" font-size="17" fill="#1e1e1e" text-anchor="start">→ eigener Grabstein rückt vor</text>
<rect x="400" y="480" width="290" height="190" rx="10" stroke="#e8590c" stroke-width="2" fill="#fff4e6" stroke-linecap="round" stroke-linejoin="round"/>
