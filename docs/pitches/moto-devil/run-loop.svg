<text x="416" y="233.4" font-size="17" fill="#1e1e1e" text-anchor="start">Bike am START, Uhr 0:00</text>
<text x="416" y="254.65" font-size="17" fill="#1e1e1e" text-anchor="start">Grabsteine aller Spieler</text>
<rect x="790" y="110" width="390" height="250" rx="10" stroke="#1971c2" stroke-width="2" fill="#e7f5ff" stroke-linecap="round" stroke-linejoin="round"/>
