<text x="806" y="203.4" font-size="17" fill="#1e1e1e" text-anchor="start">A/← D/→ kippen und Flips</text>
<text x="806" y="224.65" font-size="17" fill="#1e1e1e" text-anchor="start">Leertaste springen, E umdrehen</text>
<text x="806" y="245.9" font-size="17" fill="#1e1e1e" text-anchor="start">CHECKPOINT = neuer Respawn-Punkt</text>
<text x="806" y="267.15" font-size="17" fill="#1e1e1e" text-anchor="start">HUD: Zeit · Tode · Flips</text>
<text x="806" y="288.4" font-size="17" fill="#1e1e1e" text-anchor="start">Fallen warten in Auslösezonen</text>
