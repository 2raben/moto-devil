<text x="1306" y="254.65" font-size="17" fill="#1e1e1e" text-anchor="start">Level geschafft</text>
<text x="1306" y="275.9" font-size="17" fill="#1e1e1e" text-anchor="start">eigener Grabstein ans Ziel</text>
