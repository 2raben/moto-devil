<text x="0" y="34.199999999999996" font-size="36" fill="#1e1e1e" text-anchor="start">Moto Devil: ein Durchgang (Breadboard)</text>
<text x="0" y="67.0" font-size="20" fill="#868e96" text-anchor="start">Orte sind Kästen, was der Spieler tut, steht an den Pfeilen.</text>
<rect x="0" y="140" width="300" height="190" rx="10" stroke="#7048e8" stroke-width="2" fill="#f3f0ff" stroke-linecap="round" stroke-linejoin="round"/>
