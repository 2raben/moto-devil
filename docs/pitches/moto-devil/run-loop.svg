<polyline points="412,526 678,526" stroke="#e8590c" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="416" y="552.15" font-size="17" fill="#1e1e1e" text-anchor="start">am letzten Checkpoint</text>
<text x="416" y="573.4" font-size="17" fill="#1e1e1e" text-anchor="start">(oder START)</text>
<text x="416" y="594.65" font-size="17" fill="#1e1e1e" text-anchor="start">Fallen wieder scharf</text>
<text x="416" y="615.9" font-size="17" fill="#1e1e1e" text-anchor="start">Tode +1, Uhr läuft weiter</text>
<rect x="1290" y="480" width="380" height="170" rx="10" stroke="#868e96" stroke-width="2" fill="#f1f3f5" stroke-linecap="round" stroke-linejoin="round"/>
