<polyline points="1302,526 1658,526" stroke="#868e96" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1306" y="552.15" font-size="17" fill="#1e1e1e" text-anchor="start">pro Spieler und Level:</text>
<text x="1306" y="573.4" font-size="17" fill="#1e1e1e" text-anchor="start">geschafft ja/nein</text>
<text x="1306" y="594.65" font-size="17" fill="#1e1e1e" text-anchor="start">weitester Crash-Punkt</text>
