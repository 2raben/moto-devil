<polyline points="12,186 288,186" stroke="#7048e8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16" y="212.15" font-size="17" fill="#1e1e1e" text-anchor="start">Namen wählen oder</text>
<text x="16" y="233.4" font-size="17" fill="#1e1e1e" text-anchor="start">neuen Namen tippen</text>
<text x="16" y="254.65" font-size="17" fill="#1e1e1e" text-anchor="start">Fortschritt wird geladen</text>
<rect x="400" y="140" width="290" height="190" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#f8f9fa" stroke-linecap="round" stroke-linejoin="round"/>
